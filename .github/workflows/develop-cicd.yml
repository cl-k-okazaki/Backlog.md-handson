# develop への push で CI を回し、通ったコミットだけを ci-passed ブランチに進める。
# Codespace は ci-passed を定期的に pull して Web UI に取り込む（pull 型の CD）。
name: develop CI/CD

on:
  push:
    branches: [develop]

concurrency:
  group: develop-cicd
  cancel-in-progress: true

jobs:
  ci:
    name: build-and-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # 依存のインストールスクリプトが動く間、トークンを .git/config に残さない。
          persist-credentials: false
      # サードパーティのアクションはタグではなくコミットで固定する（v2.2.0）。
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check:types
      - run: bun run check
      - run: bun src/cli.ts --version
      # 表示言語の切り替えを、CLI と Web 画面の両方で確かめる。
      - run: bun test --timeout=10000 src/test/i18n.test.ts src/test/web-locale.test.tsx
      - run: BACKLOG_LANG=ja bun src/cli.ts --help

  promote:
    name: promote-to-ci-passed
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      # 強制上書きはしない。古い実行のやり直しや develop の書き換えで ci-passed が後ろに戻らないよう、
      # 前に進める push（fast-forward）だけを行い、そうでなければ失敗させる。
      - run: git push origin HEAD:refs/heads/ci-passed
